<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Review Assistance</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="../dist/presentation/review/renderer.js"></script>
  <script defer src="../dist/presentation/connection-renderer.js"></script>
</head>
<body>
  <header class="app-bar">
    <div class="brand"><span class="brand-icon" aria-hidden="true">±</span> Review Assistance</div>
    <div class="app-actions">
      <button class="button button-secondary" id="github-settings" type="button">GitHub</button>
      <button class="button button-secondary" id="gitlab-settings" type="button">GitLab</button>
      <button class="button button-secondary" id="back" type="button" hidden>К началу</button>
    </div>
  </header>

  <dialog class="account-dialog" id="account-dialog" aria-labelledby="account-title">
    <div class="account-header">
      <h2 id="account-title"></h2>
      <button class="button button-secondary" id="account-close" type="button">Закрыть</button>
    </div>
    <p id="account-status" role="status"></p>
    <form class="account-form" id="account-form" autocomplete="off">
      <label for="account-address">Адрес сервиса</label>
      <input id="account-address" type="url" required>
      <label for="account-token">Токен на чтение</label>
      <input id="account-token" type="password" autocomplete="off" spellcheck="false" required>
      <p class="account-help">Используйте токен с правом <code id="account-permission"></code>.</p>
      <p class="error" id="account-error" role="alert" hidden></p>
      <div class="account-actions">
        <button class="button button-primary" id="account-connect" type="submit">Подключить</button>
        <button class="button button-secondary" id="account-session" type="button" hidden>Только до выхода</button>
        <button class="button button-secondary" id="account-disconnect" type="button" hidden>Отключить</button>
      </div>
    </form>
    <form class="account-form pr-form" id="account-review-form" autocomplete="off">
      <label for="account-review-link">Ссылка на ревью</label>
      <div class="pr-form-fields">
        <input id="account-review-link" type="url" aria-describedby="account-review-help" required>
        <button class="button button-secondary" id="account-review-open" type="submit" disabled>Открыть</button>
      </div>
      <p class="account-help" id="account-review-help"></p>
      <p class="error" id="account-review-error" role="alert" hidden></p>
    </form>
  </dialog>

  <main class="shell">
    <section class="welcome" id="welcome" aria-labelledby="welcome-title">
      <h1 id="welcome-title">Ревью кода</h1>
      <p>Откройте учебный пример, чтобы посмотреть изменения в файлах.</p>
      <button class="button button-primary" id="open" type="button">Открыть пример</button>
      <p class="error" id="error" role="alert" hidden></p>
    </section>

    <section class="review" id="review" aria-labelledby="review-title" hidden>
      <header class="review-header">
        <div class="breadcrumbs"><span id="project"></span><span aria-hidden="true">/</span><span id="reference"></span></div>
        <h1 id="review-title" tabindex="-1"></h1>
        <div class="branch-row">
          <code id="source-branch"></code><span aria-hidden="true">→</span><span class="sr-only">в ветку</span><code id="target-branch"></code>
        </div>
      </header>
      <p class="diff-notice" id="diff-notice" role="status" hidden></p>
      <div class="review-grid">
        <aside class="files" aria-labelledby="files-title">
          <div class="panel-heading files-heading">
            <h2 id="files-title">Изменённые файлы</h2>
            <span class="file-count" id="file-count"></span>
          </div>
          <ul class="file-list-scroll" id="files" tabindex="0" aria-labelledby="files-title"></ul>
        </aside>
        <section class="diff" aria-labelledby="diff-title">
          <div class="panel-heading diff-heading">
            <h2 id="diff-title"></h2>
            <span class="stats" id="diff-stats"></span>
          </div>
          <div class="diff-scroll" id="diff-scroll" tabindex="0" role="region" aria-label="Строки diff"></div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
